<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f4f1">
  <title>Personal Website</title>
  <meta name="description" content="Personal portfolio website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="assets/icontab.png" type="image/png" >

</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="topbar__name" id="topbarName"></div>
      <div class="topbar__role" id="topbarRole"></div>
      <a class="topbar__contact" id="topbarContact" href="#"></a>
    </header>

    <main>
      <section class="hero-grid" aria-label="Profile">
        <article class="tile tile--dark hero-name">
          <div class="eyebrow">PERSONAL WEBSITE</div>
          <h1 id="heroName"></h1>
          <p id="heroRole"></p>
        </article>

        <article class="tile hero-photo tile--photo">
          <img id="profileImage" alt="Profile photo">
        </article>

        <article class="tile hero-meta">
          <div id="heroMeta" class="meta-list"></div>
        </article>

        <a class="tile tile--dark hero-cv" id="cvLink" download="eng_cv.pdf">
          <span>DOWNLOAD CV</span>
          <span class="tile-arrow">↗</span>
        </a>

        <article class="tile hero-tagline">
          <span id="tagline"></span>
        </article>

        <article class="tile hero-experience experience-tile">
          <div class="tile-header"><h2>Experience</h2><span class="plus">+</span></div>
          <div id="experienceList" class="timeline"></div>
        </article>

        <article class="tile hero-decoration">
          <img id="decorationImage" alt="">
        </article>
      </section>

      <section class="section-grid" aria-label="About and Education">
        <article class="tile tile--accent section-heading">
          <span class="section-heading__mark">+</span>
          <h2>About</h2>
          <p id="aboutText"></p>
        </article>

        <article class="tile education-tile section-education-tile">
          <div class="edu-icon-wrap"><img id="educationLogo" alt=""></div>
          <div>
            <div class="tile-kicker">EDUCATION</div>
            <h2 id="educationUniversity"></h2>
            <p id="educationDegree"></p>
            <p id="educationYears"></p>
          </div>
        </article>

        <article class="tile skills-tile">
          <div class="tile-header"><h2>Skills</h2><span class="plus">+</span></div>
          <div id="skillsList" class="chip-list"></div>
        </article>
      </section>

      <section class="projects-section" aria-label="Projects">
        <div class="projects-topbar">
          <div>
            <div class="eyebrow">SELECTED WORK</div>
            <h2>Projects</h2>
          </div>
          <div class="project-search">
            <label class="search-box">
              <span aria-hidden="true">⌕</span>
              <input id="projectSearch" type="search" placeholder="Search projects…" autocomplete="off">
            </label>
            <div class="tag-filters" id="tagFilters"></div>
          </div>
        </div>
        <div class="project-grid" id="projectGrid"></div>
        <div class="no-results" id="noResults" hidden>No projects found.</div>
      </section>

      <section class="links-section" aria-label="Links">
        <div class="links-heading">
          <div class="eyebrow">CONTACT & SOCIAL</div>
          <h2>Links</h2>
        </div>
        <div class="links-grid" id="linksGrid"></div>
      </section>
    </main>

    <footer class="footer">
      <span id="footerName"></span>
      <span id="footerYear"></span>
    </footer>
  </div>

  <script src="config.js"></script>
  <script src="scripts.js"></script>
</body>
</html>
